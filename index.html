<!DOCTYPE html>
<html>

<head>
    <title>Dayrie.com</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="profile.png">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron&display=swap" rel="stylesheet">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            background: linear-gradient(-45deg, black, darkred, purple, black);
            background-size: 400% 400%;
            background-attachment: fixed;
            animation: gradient 10s ease infinite, fadeIn 1s;

            color: white;
            text-align: center;
            font-family: Orbitron;

            overflow-x: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -3;
            top: 0;
            left: 0;
        }

        /* CURSOR GLOW */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,0,0,0.25) 0%, rgba(255,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        /* TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            width: 90%;
            max-width: 500px;

            margin: auto;
            margin-top: 20px;

            padding: 10px 20px;

            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            backdrop-filter: blur(15px);

            box-shadow: 0 0 20px rgba(255,0,0,0.2);
        }

        .status {
            color: lime;
            font-size: 14px;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: lime;
            border-radius: 50%;
            box-shadow: 0 0 10px lime;
            animation: pulse 1s infinite;
        }

        #clock {
            color: white;
            font-size: 14px;
        }

        /* GAME PANEL */
        .game-panel {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);

            width: 180px;

            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);

            padding: 15px;
            border-radius: 15px;

            box-shadow: 0 0 20px rgba(255,0,0,0.3);
        }

        .game-panel h3 {
            margin: 0;
            font-size: 16px;
            color: red;
        }

        .score {
            font-size: 18px;
            margin: 10px 0;
        }

        .click-btn {
            width: 100%;
            padding: 10px;

            border: none;
            border-radius: 10px;

            background: red;
            color: white;

            font-family: Orbitron;
            cursor: pointer;

            transition: 0.2s;
        }

        .click-btn:hover {
            transform: scale(1.05);
        }

        /* MAIN CONTAINER */
        .container {
            width: 90%;
            max-width: 400px;
            margin: auto;
            margin-top: 40px;

            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow: 0 0 30px rgba(255,0,0,0.3);
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-top: 20px;
            object-fit: cover;

            border: 4px solid red;
            box-shadow: 0 0 25px red;
        }

        h1 {
            font-size: 50px;
            margin-top: 10px;
            text-shadow: 0 0 20px red;
        }

        h2 {
            color: black;
            margin-top: -10px;
        }

        p {
            color: lightgray;
        }

        .link-button {
            display: block;

            color: white;
            text-decoration: none;

            padding: 15px;
            margin: 20px auto;

            width: 250px;

            border-radius: 12px;

            font-size: 20px;

            transition: 0.3s;

            box-shadow: 0 0 15px red;
        }

        .link-button:hover {
            transform: scale(1.05) rotate(-1deg);
            box-shadow: 0 0 25px white;
        }

        .youtube { background: red; }
        .discord { background: rgb(98,0,255); }
        .tiktok { background: rgb(58,58,58); }
        .twitch { background: rgb(234,0,255); }
        .x { background: rgb(39,39,39); }

        .footer {
            margin-top: 50px;
            color: gray;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>

<body>

<!-- EFFECTS -->
<div id="particles-js"></div>
<div class="cursor-glow"></div>

<!-- GAME -->
<div class="game-panel">
    <h3>Mini Game</h3>
    <div class="score">Score: <span id="score">0</span></div>
    <button class="click-btn" onclick="addScore()">CLICK ME</button>
</div>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="status">
        <span class="dot"></span> ONLINE
    </div>

    <div id="clock"></div>
</div>

<!-- MAIN -->
<div class="container">

    <img src="profile.png" class="profile-pic">

    <h1>Dayrie Socials</h1>

    <h2>@DayrieYT</h2>

    <p>Check out my stuff:</p>

    <a class="link-button youtube" href="https://youtube.com/@DayrieYT" target="_blank">YouTube</a>
    <a class="link-button discord" href="https://discord.gg/ah6f85c4Z7" target="_blank">Discord</a>
    <a class="link-button tiktok" href="https://tiktok.com/@dayrie_0" target="_blank">TikTok</a>
    <a class="link-button twitch" href="https://twitch.tv/dayrie_1" target="_blank">Twitch</a>
    <a class="link-button x" href="https://x.com/DayrieYT" target="_blank">X</a>

    <p class="footer">Made by Dayrie</p>

</div>

<!-- PARTICLES -->
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

<script>
particlesJS("particles-js", {
    particles: {
        number: { value: 80 },
        color: { value: ["#ff0000", "#000000", "#5865F2"] },
        line_linked: { enable: true, color: "#ff0000" },
        move: { speed: 2 }
    }
});
</script>

<!-- CLOCK + CURSOR + GAME -->
<script>
function updateClock() {
    document.getElementById("clock").innerHTML =
        new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

const glow = document.querySelector(".cursor-glow");

document.addEventListener("mousemove", (e) => {
    glow.style.left = e.clientX + "px";
    glow.style.top = e.clientY + "px";
});

/* MINI GAME */
let score = 0;

function addScore() {
    score++;
    document.getElementById("score").innerText = score;
}
</script>

</body>
</html>
